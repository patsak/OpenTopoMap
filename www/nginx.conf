# The front door of the stack: everything the browser talks to arrives here.
#
#   /previews/<id>.pmtiles   files on the shared volume, read with Range requests
#   everything else          garminsvc (gunicorn): the page, the API, the style assets
#
# One origin for the whole stack, which is not cosmetic. A preview is read by
# MapLibre with range requests, so while the page and the .pmtiles lived on two
# ports every one of those requests needed CORS, and the service had to hand the
# browser an absolute URL of the other port for a file of its own. Behind one
# origin a preview is just /previews/<id>.pmtiles.

upstream garminsvc {
    server garminsvc:8080;
    # The proxy talks HTTP/1.1 below, so connections can be reused instead of
    # opening a new one per XHR - the page polls /jobs and /preview/<id>.
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # POST /maps/upload carries an .osm/.osm.pbf. Flask caps it at
    # garminsvc.constants.MAX_UPLOAD_BYTES (200 MB) and answers with a JSON 413
    # the UI knows how to show, so nginx has to allow more than that - otherwise
    # the user gets nginx's HTML error page instead.
    client_max_body_size 256m;

    # Serves the built previews (<preview_id>.pmtiles) straight off the volume.
    # Static files with Range support are all this needs, and nginx does that
    # out of the box - no proxy, and gunicorn never sees a tile request.
    #
    # root rather than alias: the mount is /srv/previews, so the request path
    # already maps onto it, and try_files (which alias does not get right) is
    # not needed to 404 a preview that has been swept.
    location /previews/ {
        root /srv;

        types { }
        default_type application/octet-stream;

        # The files are immutable: the name carries the preview id, and the
        # contents under that name never change. They do not last forever,
        # though - a preview is swept once its TTL is up
        # (otmlib.previews.TTL_SECONDS, 24 h), so max-age matches that rather
        # than outliving the file it caches.
        add_header Cache-Control "public, max-age=86400, immutable" always;

        # Same origin as the page now, so nothing here needs CORS. It stays for
        # a deployment that publishes the previews under a host of its own
        # (OTM_PREVIEW_PUBLIC_URL): Content-Range has to be visible to JS, or
        # the pmtiles library cannot make sense of a 206.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;

        # Nothing to compress: the tiles inside a pmtiles archive are gzip
        # already, and gzip on top of it breaks ranges.
        gzip off;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Everything else is the service: /, /static, /maps, /jobs, /preview,
    # /regions, /vector and /health included.
    location / {
        proxy_pass http://garminsvc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matches gunicorn's own --timeout (docker-entrypoint.sh): a 200 MB
        # upload is written and hashed inside one request, and nothing else
        # here is long - a build is queued and answered with 202.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Buffering stays on deliberately. A finished .img is handed out by
        # /jobs/<id>/download and can be hundreds of megabytes; with buffering
        # nginx takes it from gunicorn at local speed and feeds the client at
        # whatever rate it manages, instead of one slow download holding a
        # worker thread for the length of it.
    }

    # The nginx container's own liveness, for the compose healthcheck: /health
    # is the service's, and answering it here would report the stack up while
    # gunicorn was down.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
