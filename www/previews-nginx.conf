# Serves built previews (<preview_id>.pmtiles) as static files.
#
# The browser reads a pmtiles archive with range requests, so two things matter
# here: nginx handles Range itself, and CORS is needed because the page is on a
# different port (8080 against 8081). Content-Range has to be visible to JS -
# without it the pmtiles library cannot make sense of a 206.
server {
    listen 80;
    server_name _;

    # The files are immutable: the name carries the preview id, and the
    # contents under that name never change. They do not last forever, though -
    # a preview is swept once its TTL is up (otmlib.previews.TTL_SECONDS, 24 h),
    # so max-age below matches that rather than outliving the file it caches.
    location / {
        root /srv;
        try_files /previews$uri =404;

        types { }
        default_type application/octet-stream;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        add_header Cache-Control "public, max-age=86400, immutable" always;

        # Nothing to compress: the tiles inside a pmtiles archive are gzip
        # already, and gzip on top of it breaks ranges.
        gzip off;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
