# Раздача собранных превью (<preview_id>.pmtiles) как статики.
#
# Браузер читает pmtiles range-запросами, поэтому важны две вещи: Range nginx
# поддерживает сам, а CORS нужен потому, что страница живёт на другом порту
# (8080 против 8081). Заголовок Content-Range обязан быть виден JS - без него
# библиотека pmtiles не поймёт ответ 206.
server {
    listen 80;
    server_name _;

    # Файлы неизменяемы: имя содержит id превью, содержимое под ним не меняется.
    location / {
        root /srv;
        try_files /previews$uri =404;

        types { }
        default_type application/octet-stream;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;

        # Сжимать нечего: тайлы внутри pmtiles уже gzip, а gzip поверх ломает
        # диапазоны.
        gzip off;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
