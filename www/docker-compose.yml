# The whole OpenTopoMap stack: the Garmin build service, the tile job, the
# preview worker, and the nginx in front of all of them - the one entry point,
# serving the built previews itself and proxying the rest.
#
#   cd www && docker compose up --build
#   open http://localhost:8080
#
# Prebuilt image from master: ghcr.io/patsak/opentopomap-garminsvc:latest
#
# tilesvc-job keeps the region PBFs current from Geofabrik's diffs. Everything
# downstream cuts its own bbox out of those same files with osmium: garminsvc
# for an .img build, tilesvc-preview for a map preview. Postgres holds metadata
# only - the last applied osc.gz, which regions are covered, the previews -
# plus the garminsvc job queue.
#
# The project name is pinned: compose otherwise names the project after the
# directory holding this file, and moving the file would rename every container
# and orphan the postgres_data volume with the job records in it.
name: garminsvc

services:
  # Plain Postgres: nothing here stores geometry any more (region coverage is
  # four floats, see www/tilesvc/sql/001_schema.sql), and no query renders a
  # tile - so no PostGIS, and none of the shared_buffers / shm_size / prewarm
  # tuning that a per-request ST_AsMVT pipeline needed.
  postgres:
    image: ${OTM_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: otm
      POSTGRES_PASSWORD: otm
      POSTGRES_DB: otm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otm -d otm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Runs once and exits: mkgmap needs the precomputed coastline and boundary data
  # (~4.5 GB unpacked), which is too large to bake into the image and so lives in
  # the shared volume. This used to happen on first boot inside gunicorn's app
  # factory, which is why the healthcheck below needed a fifteen-minute grace
  # period before the process answered anything. Re-running it is a no-op, so it
  # stays in the dependency chain rather than being a one-off setup command.
  garminsvc-init:
    build:
      context: ..
      dockerfile: www/garminsvc/Dockerfile
    image: ghcr.io/patsak/opentopomap-garminsvc:latest
    working_dir: /app
    # The image entrypoint starts gunicorn; this container only fills the volume.
    entrypoint: ["/opt/otm-venv/bin/python", "-m", "garminsvc.fetchdata"]
    environment:
      OTM_DATA_DIR: /app/data
    volumes:
      - ./garminsvc/data:/app/data
      - ./otmlib:/app/otmlib:ro
    restart: "no"

  garminsvc:
    build:
      context: ..
      dockerfile: www/garminsvc/Dockerfile
    image: ghcr.io/patsak/opentopomap-garminsvc:latest
    working_dir: /app
    # No published port: the browser reaches the service through the nginx
    # below, which is the only thing in the stack bound to a host port.
    expose:
      - "8080"
    environment:
      OTM_HOST: "0.0.0.0"
      OTM_PORT: "8080"
      OTM_DOCKER: "1"
      # Every request arrives from nginx, so the peer address and the scheme
      # are in X-Forwarded-* rather than on the connection (see server.py).
      OTM_TRUST_PROXY: "1"
      OTM_GARMIN_DIR: /garmin
      OTM_VENV_PYTHON: /opt/otm-venv/bin/python
      JAVA_MEM: ${JAVA_MEM:-4g}
      OTM_DATA_DIR: /app/data
      DATABASE_URL: postgresql://otm:otm@postgres:5432/otm
      # Where the browser reads built previews from. Same origin as the page
      # now, so a path is enough; set it to an absolute URL only when the
      # previews are published under a host of their own.
      OTM_PREVIEW_PUBLIC_URL: "${OTM_PREVIEW_PUBLIC_URL:-/previews}"
    volumes:
      - ./garminsvc/data:/app/data
      - ./otmlib:/app/otmlib:ro
      - ../garmin/style:/garmin/style:ro
      - ../garmin/opentopomap_hike_options:/garmin/opentopomap_hike_options:ro
      - ../garmin/contours_hike_options:/garmin/contours_hike_options:ro
      - ../vector/maplibregljs:/app/vector/maplibregljs:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Nothing to serve until the sea/bounds data is on the volume: the server
      # validates it at startup and refuses to come up without it.
      garminsvc-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # On a schedule: Geofabrik → osmium apply-changes → tilemaker → mbtiles.
  # To run it by hand:
  #   docker compose run --rm tilesvc-job python -m tilesvc
  tilesvc-job:
    build:
      context: ..
      dockerfile: www/tilesvc/Dockerfile
    image: ghcr.io/patsak/opentopomap-tilesvc:latest
    working_dir: /app
    command: ["supercronic", "/app/tilesvc/crontab"]
    # tilemaker is the memory-hungry step: it holds the tile it is writing plus
    # index windows over the node/way store, and osmium merge/apply-changes
    # stream whole federal-district PBFs alongside. Uncapped, a bad run exhausts
    # the Colima VM and takes the Docker daemon with it; capped, the container's
    # own OOM killer ends the job and the host survives. --store keeps the bulk
    # of tilemaker's working set on disk (see tilemaker.py), which is what makes
    # a few GB enough here at all.
    mem_limit: ${OTM_TILESVC_MEM:-6g}
    environment:
      OTM_DATA_DIR: /app/data
      DATABASE_URL: postgresql://otm:otm@postgres:5432/otm
      OTM_TILEMAKER_THREADS: ${OTM_TILEMAKER_THREADS:-2}
    volumes:
      - ./garminsvc/data:/app/data
      - ../vector/tilemaker:/app/vector/tilemaker:ro
      - ./tilesvc:/app/tilesvc:ro
      - ./otmlib:/app/otmlib:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


  # Area previews, on a button press: their own queue (otmlib.previewqueue), so
  # a preview never waits out a multi-hour .img build in the garminsvc queue.
  # Same image as tilesvc-job - tilemaker and osmium are already in it.
  #   docker compose logs -f tilesvc-preview
  tilesvc-preview:
    build:
      context: ..
      dockerfile: www/tilesvc/Dockerfile
    image: ghcr.io/patsak/opentopomap-tilesvc:latest
    working_dir: /app
    command: ["python", "-m", "tilesvc.preview"]
    # One bbox at a time, and a bbox is a fraction of a region - so a fraction
    # of what the nightly full build needs.
    mem_limit: ${OTM_PREVIEW_MEM:-4g}
    environment:
      OTM_DATA_DIR: /app/data
      DATABASE_URL: postgresql://otm:otm@postgres:5432/otm
      OTM_TILEMAKER_THREADS: ${OTM_TILEMAKER_THREADS:-2}
    volumes:
      - ./garminsvc/data:/app/data
      - ../vector/tilemaker:/app/vector/tilemaker:ro
      - ./tilesvc:/app/tilesvc:ro
      - ./otmlib:/app/otmlib:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The front door, and the only service bound to a host port: the page, the
  # API and the built previews on one origin (see nginx.conf). Requests are
  # proxied to garminsvc, except /previews/ - one .pmtiles per area, read
  # straight off the shared volume with range requests. Static files are all
  # that needs, and nginx does it out of the box.
  nginx:
    image: ${OTM_NGINX_IMAGE:-nginx:1.27-alpine}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./garminsvc/data/previews:/srv/previews:ro
    ports:
      - "${OTM_PORT:-8080}:80"
    depends_on:
      # Only so the name resolves: nginx looks the upstream up when it reads the
      # config and exits if it cannot. Nothing waits for the service to be
      # healthy - a 502 while gunicorn boots is better than a closed port.
      garminsvc:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
