# OpenTopoMap Garmin map service
#
#   docker compose up --build
#   open http://localhost:8080
#
# Готовый образ с master: ghcr.io/patsak/opentopomap-mapsvc:latest
#
# Кэш Geofabrik/DEM, SQLite-джобы, sea/bounds — в ./data

services:
  mapsvc:
    build: .
    image: ghcr.io/patsak/opentopomap-mapsvc:latest
    working_dir: /app
    ports:
      - "${OTM_PORT:-8080}:8080"
    environment:
      OTM_HOST: "0.0.0.0"
      OTM_PORT: "8080"
      OTM_DOCKER: "1"
      OTM_VENV_PYTHON: /opt/otm-venv/bin/python
      JAVA_MEM: ${JAVA_MEM:-4g}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
