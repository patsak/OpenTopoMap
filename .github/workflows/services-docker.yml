name: services docker

on:
  push:
    branches: [master]
    # www/** covers otmlib, which is baked into both images.
    paths:
      - "www/**"
      - "vector/tilemaker/**"
      - "garmin/style/**"
      - "garmin/opentopomap_hike_options"
      - "garmin/contours_hike_options"
      - ".github/workflows/services-docker.yml"
  pull_request:
    paths:
      - "www/**"
      - "vector/tilemaker/**"
      - "garmin/style/**"
      - "garmin/opentopomap_hike_options"
      - "garmin/contours_hike_options"
      - ".github/workflows/services-docker.yml"
  workflow_dispatch:

concurrency:
  group: services-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job records, tile metadata and the huey queue all live in Postgres, and
    # the SQL behind them is worth running rather than mocking. Without
    # DATABASE_URL those tests skip (see www/conftest.py), so a local run needs
    # nothing installed - but CI should not be the place that skips them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otm
          POSTGRES_PASSWORD: otm
          POSTGRES_DB: otm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otm -d otm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium and GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool gdal-bin python3-gdal libgdal-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest gdal=="$(gdal-config --version)"
          python -m pip install -r www/garminsvc/requirements-server.txt
          python -m pip install -r www/tilesvc/requirements.txt

      - name: Run tests
        working-directory: www
        env:
          DATABASE_URL: postgresql://otm:otm@localhost:5432/otm
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: garminsvc
            dockerfile: www/garminsvc/Dockerfile
          - service: tilesvc
            dockerfile: www/tilesvc/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/opentopomap-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
