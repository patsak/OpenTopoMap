<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Campsite. The Garmin bitmap (TYP type 0x661d) is an anti-aliased green
       blob that reads as a tree on a hiking map, so the shape is redrawn as a
       tent while keeping the greens of that symbol. -->
  <path d="M11 1.4 L11 5.5" fill="none" stroke="#146C0C" stroke-width="1.4" stroke-linecap="square"/>
  <path d="M11 4.1 L19.3 18.6 L2.7 18.6 Z" fill="#00A200" stroke="#146C0C" stroke-width="1.4"
        stroke-linejoin="miter"/>
  <path d="M11 9.6 L14.8 18.6 L7.2 18.6 Z" fill="#146C0C"/>
</svg>
